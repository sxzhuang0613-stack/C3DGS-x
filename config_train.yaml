# 训练配置：两个阶段与可选预处理
# 相对路径以本文件为基准；cuda:0 尊重外部 CUDA_VISIBLE_DEVICES。
# 保留原实验的损失权重和 12500 步插层起点。

# 运行设备与随机性
device: "cuda:0"
random_seed: 8439453

# 数据来源、病例划分与参考相位
dataset_name: "acdc"
dataset_paths: {"acdc": "/home/exouser/datasets/ACDC/database_npz", 
                "mnms": "/home/exouser/Datasets/MnMs/MnM/data_npz",
                }
dataset_mode: "all"
train_fraction: 0.7
normalization_epsilon: 0.0001
num_workers: 0
pin_memory: true
reference_phase: 0

# legacy_box 坐标边界；所有加载模型仍须提供匹配的渲染和几何记录
bounds: [1.0, 1.0, 1.0]
legacy_color_policy: "strict"

# 渲染模型："innergs_alpha_fixed_v1"（旧：固定 opacity=1 的 alpha 合成，零厚度点采样）或
# "additive_slab_v1"（diff_gaussian_rasterization_mri：沿法向层厚积分 + 信号线性加和，强度 softplus 非负）
render_model: "additive_slab_v1"
background: 0.0
raster_debug: false
# [additive] 层面轮廓 FWHM，以层间距 sz 为单位；1.0 即相邻层恰好相接，0 为零厚度截面。
# 数据未提供层厚，此值为实现选择而非采集参数
slice_thickness_fwhm_spacing: 1.0
# [additive] 截断：几何幅值 a·G 低于该值的像素项不累加（与强度无关，暗点仍有梯度）
amplitude_cutoff: 0.00392156862745098

# 训练/测试共用的 SSIM 定义，data_range 为归一化强度范围
ssim_window_size: 5
ssim_sigma: 1.5
ssim_k1: 0.01
ssim_k2: 0.03
data_range: 1.0

# 输出与模型路径
# 每例输出 <output_path>/<case>/：training_state.pth、PLY 及几何记录、loss_curves.png（每 loss_plot_interval 覆盖）、
# reconstructions/iter_XXXXXX.png（每 reconstruct_interval 一张全切片拼图）。旧实验结果保留在 /home/exouser/Outputs/C3DGS
output_path: "/home/exouser/codes/OutPut/C3DGS"
stage1_model_root: "/home/exouser/codes/OutPut/C3DGS"
stage2_output_path: "/home/exouser/codes/OutPut/C3DGS/stage2_experiments"

# Stage1 训练、恢复与保存
iters: 20000
stage1_resume: true
stage1_skip_existing: true
warm_start_ply_path: ""
checkpoint_interval: 1000
save_ply: true
save_iterations: [10000, 20000]
loss_plot_interval: 1000
# 每隔该步数把窗口内各结构周期的 split/剪枝/放行数与门限汇总写入 <case>/structure_log.csv
structure_log_interval: 500
# 是否每 reconstruct_interval 步保存"原图 | 渲染"并排拼图（含逐层 PSNR/SSIM）
visualize: true
reconstruct_interval: 2000
interp_step_size: 0.25
status_interval: 10
plot_dpi: 150

# Stage1 初始化点数（经典 kNN 尺度随点数自适应）；后续只通过 Split 增加，不设点数上限或每周期增长预算
num_pts: 1000
init_uniform_fraction: 0.5
init_foreground_fraction: 0.3
# 边缘比例为 1-uniform-foreground
init_foreground_threshold: 0.05
init_sampling_quantiles: [0.01, 0.99]
init_foreground_dilation: 2
init_edge_sigma: 1.0
init_edge_truncate: 3.0
init_edge_quantile: 0.8
init_grid_jitter: 0.35
init_normal_jitter: 0.45
# 初始尺度按经典 3DGS：各向同性 sigma=sqrt(到最近 3 个中心平方距离的均值)，下界为 min_sigma_pixels
init_support_retries: 3
init_fit_steps: 20
init_cg_rtol: 0.001
init_ridge_relative: 0.0001
# [additive] CG 解截到非负后的非负最小二乘乘性更新步数（每步一次前向+伴随）
init_nonneg_steps: 20

# Stage1 优化器与位置学习率
position_lr_init: 0.00016
position_lr_final: 1.6e-05
# 与 iters 一致，训练结束时位置学习率恰好衰减到 position_lr_final
position_lr_max_steps: 20000
# 兼容现有位置调度器；其 delay_steps 默认 0，学习率曲线保持不变
position_lr_delay_mult: 0.01
intensity_lr: 0.0025
scaling_lr: 0.005
rotation_lr: 0.001
adam_eps: 1.0e-15
adam_betas: [0.9, 0.999]
# 模型坐标下的数值安全边界；实际尺度下界由 min_sigma_pixels 按病例面内像素换算
log_scale_min: -10.0
log_scale_max: 10.0
# 任一局部轴标准差不小于该面内像素数；像素中心采样、无抗锯齿时更细的核退化为脉冲
min_sigma_pixels: 0.5

# 真实切片采样及空间插层监督
real_slices_per_iter: 2
interpolation: true
# 早于 densify_until_iter，使插层误差也能驱动结构调整
interpolate_iter: 5000
interpolation_probability: 0.5
interpolation_alpha_min: 0.2
interpolation_alpha_max: 0.8

# Stage1 损失权重，保持原有效默认值
lambda_l1: 2.0
lambda_ssim: 0.25
lambda_anisotropic: 0.1
# 插层分支未命中时额外采样一张真实切片的 L1/SSIM 权重
lambda_interp_l1: 1.0
lambda_interp_ssim: 0.1
# 插层：强度落在相邻两层之间的区间约束（替代像素级线性混合，避免双重轮廓）
lambda_interp_envelope: 1.0
anisotropic_max_ratio: 6.0
anisotropic_epsilon: 1.0e-06

# 结构操作调度：[densify_from_iter, densify_until_iter) 内每 densification_interval 步一次，最后一次在 9800 步；
# 此后高斯数目定型，剩余步数只优化参数（与经典 3DGS 增殖窗口后不再增删一致）
densify_from_iter: 1000
densify_until_iter: 10000
densification_interval: 200

# 批量结构调整：残差门控 Split + 尺寸超限强制 Split + 观测框/无效点剪枝；不做 Clone，不按贡献质量删除
# 须与 render_model 配套：alpha → batch_residual_v5；additive → additive_moment_v1
structural_algorithm: "additive_moment_v1"
structural_min_points: 1
# g_voxel 为按 XYZ 体素长度换算的平均位置梯度；首个周期以 multiplier*正梯度中位数标定后冻结，
# 实际门限取 max(grad_threshold, 冻结值)，不再每周期按相对中位数选出固定比例
structural_grad_threshold: 0.0
structural_grad_multiplier: 2.0
structural_min_observations: 8
# 覆盖区平均残差 sum(T*alpha*|r|)/sum(T*alpha) 的绝对门限（归一化强度），即可接受误差；越小最终点数越多。
# ACDC 残差下限约 0.001-0.002（噪声 E|r|≈0.8σ、uint8 量化 step/4，收敛时 E/W 中位数实测 0.0017-0.002），取约 3 倍
structural_residual_threshold: 0.005
# 增殖支撑门：真实层贡献质量 sum(T*alpha) 不低于该像素当量才可 Split（避免 E/W 小数相除的噪声）；
# 只门控增殖，不删除低贡献点（层间点可能服务插层渲染）
structural_support_min_weight: 0.5
# 增殖窗口结束后是否继续审计（剪除框外点、拆分尺寸超限点）；false 表示 densify_until_iter 后不再改变高斯数目
structural_prune_after_densify: false
# 面内投影最大标准差，单位为输出像素；超过该值且通过梯度/残差门的点 Split（不做 Clone）。
# 核需放进最薄组织带：FWHM=2.355σ <= 心肌厚度。ACDC 约 1 mm/px，心肌厚度 p10/中位数 5.6/7.5 mm -> σ 2.4/3.2 px
structural_split_sigma_pixels: 2.5
# 增殖统计只用面内 (x,y) 位置梯度（对应经典 3DGS 屏幕空间梯度）；false 时用含 z 的三维体素梯度
structural_inplane_gradient: false
# 是否启用贡献审计与残差门（E/W > tau、W 支撑门）；false 即经典 3DGS 模式，结构周期无额外渲染
structural_residual_gate: true
# 消融开关：是否启用 Split（包含误差驱动与尺寸超限强制拆分）；Clone 已取消
structural_enable_split: true
# 尺寸超限强制 Split（不删除、不受梯度/残差门控，增殖窗口后也执行）：从第 3000 步起，
# 本周期最大候选半径超过 20 像素，或面内投影标准差超过 0.1*max(bounds) 的点拆成两个 1/1.6 尺度的子点；
# 子点仍超限则下个周期继续拆。不限制沿法向的拉长。单项阈值为 0 时关闭该项
structural_size_split_from_iter: 3000
structural_size_max_screen_radius: 20.0
structural_size_max_scale_ratio: 0.1
# 保留暗色点，不按颜色强度剪枝
structural_prune_peak: 0.0
# ---- [additive_moment_v1] 加和模型结构操作；上面的残差门/支撑门/inplane_gradient/size_max_scale_ratio 仅旧算法使用 ----
# D1 面内、D2 法向分裂沿主轴矩匹配（保持总信号/质心/协方差）：σ_j→rσ_j，中心 ±σ_j√(1-r²)，I→I/(2r)。
# r=0.8 时分裂瞬间场的相对 L2 变化约 4.5%
structural_split_ratio: 0.8
# D3 尺寸强制分裂同样矩匹配，但对半缩小最长面内轴（r=0.5，I 不变）以尽快降到上限以下
structural_size_split_ratio: 0.5
# D3 面内投影标准差上限（像素）；与 structural_size_max_screen_radius 任一超限即强制分裂
structural_size_max_sigma_pixels: 4.0
# D2 法向门限 = 倍数 × 首周期「≥2 层观测点」平均 |n·∂L/∂μ| 的中位数，随后冻结
structural_normal_grad_multiplier: 2.0
# D2 冲突比 1-|Σ_t H_t|/Σ_t|H_t| 门限：0.5 即上下层把中心往相反方向拉且大小相当
structural_normal_conflict: 0.5
# 统计与 D2 子代可观测判据：本层几何幅值 a ≥ 该值才算「落在该层上」
structural_observe_amplitude: 0.1
# P1 解析不可见剪枝：I·sqrt(cc/(cc+s²)) < ε 时在任意层位都低于量化精度（归一化强度 1/255）
structural_prune_intensity: 0.00392156862745098

# Stage2 网络与控制点参数（不改变 motion 算法）
evolution_hidden_dim: 128
kinematics_depth: 4
optics_depth: 3
residual_fourier_bands: 3
residual_scale: 1.0
motion_dimension: "2D"
num_ode_steps: 4
through_plane_max_displacement: 0.1
transverse_max_log_scale: 0.7
control_deformation_mode: "kernel"
control_coverage_radius: 0.1
control_min_points: 32
control_max_points: 5000
control_neighbors: 8
control_kernel_bandwidth: 0.0
control_mls_regularization: 0.0001
control_knn_chunk_size: 32768

# Stage2 训练、正则与导出
stage2_iters: 20000
stage2_slice_training_mode: "all_slices"
stage2_sampling_mode: "balanced"
kinematics_lr: 0.0001
optics_lr: 5.0e-05
optics_weight_decay: 0.0
stage2_adam_eps: 1.0e-15
stage2_min_lr: 0.0
lambda_volume: 0.1
lambda_smoothness: 0.01
lambda_control_anchor: 1.0
lambda_folding: 0.0
folding_epsilon: 0.0
stage2_ssim_weight: 0.0
stage2_grad_clip: 0.0
stage2_save_interval: 1000
stage2_loss_plot_interval: 1000
stage2_resume: true
stage2_skip_existing: true
stage2_export_motion: false
stage2_export_dense_flow: false
dense_flow_chunk_size: 32768

# 仅显式执行 temp.py 时使用；默认不覆盖已有 NPZ
preprocess_image_path: "/data1/zhuangshuxin/datasets/shengyi_all/cropped/images/cmr"
preprocess_label_path: "/data1/zhuangshuxin/datasets/shengyi_all/cropped/labels/cmr_Myo_mask"
preprocess_output_path: "/data1/zhuangshuxin/datasets/shengyi_all/cropCMRnpz"
preprocess_target_frames: 40
preprocess_time_axis: 0
preprocess_normalization: "slice_uint8"
preprocess_epsilon: 1.0e-08
preprocess_overwrite: false

# 遗留 flow 接口的外部归一化文件路径
flow_norm_path: "/data1/zhuangshuxin/codes/MI_prediction/flow_norm.json"
